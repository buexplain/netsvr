#日志级别 debug、info、warn、error
LogLevel = "info"
# 提供服务的方式，目前支持：worker、redis、amqp091、callback
Service = "worker"
# worker服务的监听地址
WorkerListenAddress = "127.0.0.1:6061"
# 任务服务的监听地址
TaskListenAddress = "127.0.0.1:6062"
# 输出客户端界面的http服务的监听地址
ClientListenAddress = "127.0.0.1:6064"
# customer服务的websocket连接地址
CustomerWsAddress = "ws://127.0.0.1:6060/netsvr"
# 客户端websocket发送的心跳消息
CustomerHeartbeatMessage = "~6YOt5rW35piO~"
# business进程向网关的worker服务器发送的心跳消息
WorkerHeartbeatMessage = "~6YOt5rW35piO~"
# business进程向网关的task服务器发送的心跳消息
TaskHeartbeatMessage = "~6YOt5rW35piO~"

# Redis队列的配置，不需要则不配置
[RedisQueue]
# 公共配置，会合并到 OnOpen、OnMessage、OnClose 配置节点中
# Redis地址 host:port
Address = "127.0.0.1:6379"
# Redis密码
Password = ""
# Redis数据库
DB = 0
Key = "netsvr:queue:onopenclose"
# Redis队列的key类型，目前支持：stream、list(左侧压入消息)
KeyType = "list"
# 发送消息的Redis队列
[RedisQueue.OnMessage]
Key = "netsvr:queue:onmessage"
KeyType = "stream"

# AMQP091队列的配置，不需要则不配置
[AMQP091Queue]
# 公共配置，会合并到 OnOpen、OnMessage、OnClose 配置节点中
# RabbitMQ服务器地址 host:port
Address = "localhost:5672"
# 用户名
Username = "guest"
# 密码
Password = "guest"
# 虚拟主机（默认 /，可省略）
VHost = "/"
Exchange = "netsvr.events"
# Exchange类型: direct, fanout, topic, headers
ExchangeType = "topic"
# 是否持久化
Durable = true
# 是否自动删除
AutoDelete = false
[AMQP091Queue.OnMessage]
Queue = "business.onmessage"
RoutingKey = "event.onmessage"
[AMQP091Queue.OnOpen]
Queue = "business.onopenclose"
RoutingKey = "event.onopenclose"
[AMQP091Queue.OnClose]
Queue = "business.onopenclose"
RoutingKey = "event.onopenclose"
